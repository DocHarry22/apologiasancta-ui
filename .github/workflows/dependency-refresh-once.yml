name: Dependency Refresh (one-shot)

on:
  push:
    branches:
      - security/dependency-hardening-2026-08

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: security/dependency-hardening-2026-08

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply non-breaking npm audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Verify complete dependency audit baseline
        run: |
          npm run audit:production
          npm run audit:high
          npm run audit:all

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required."
          else
            git add package-lock.json
            git commit -m "chore(deps): apply npm audit fixes to lockfile"
            git push origin HEAD:security/dependency-hardening-2026-08
          fi
