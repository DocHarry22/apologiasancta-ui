name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag to attach signed APK/AAB assets to
        required: false
        type: string
  push:
    branches: [main]

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          NEXT_PUBLIC_ENGINE_URL: https://apologiasancta-engine.onrender.com
          NEXT_PUBLIC_RESEARCH_GRAPH_URL: https://mediumvioletred-kingfisher-797460.hostingersite.com
          NEXT_PUBLIC_APP_URL: https://sandybrown-bear-488955.hostingersite.com
          NEXT_PUBLIC_ANDROID_APK_URL: https://github.com/DocHarry22/apologiasancta-ui/releases/latest/download/apologia-sancta.apk

      - name: Sync Capacitor
        run: npm run cap:sync
        env:
          CAPACITOR_SERVER_URL: https://sandybrown-bear-488955.hostingersite.com
          NEXT_PUBLIC_APP_URL: https://sandybrown-bear-488955.hostingersite.com

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Sync packaged APK filenames
        run: npm run apk:sync
        env:
          APP_VERSION_NAME: main-${{ github.run_number }}
          APK_SOURCE: android/app/build/outputs/apk/debug/apologia-sancta-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: apologiasancta-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            public/downloads/apologia-sancta.apk
            public/downloads/apologia-sancta-v*.apk

  signed-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Decode release keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/apologiasancta-release.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build web app
        run: npm run build
        env:
          NEXT_PUBLIC_ENGINE_URL: https://apologiasancta-engine.onrender.com
          NEXT_PUBLIC_RESEARCH_GRAPH_URL: https://mediumvioletred-kingfisher-797460.hostingersite.com
          NEXT_PUBLIC_APP_URL: https://sandybrown-bear-488955.hostingersite.com
          NEXT_PUBLIC_ANDROID_APK_URL: https://github.com/DocHarry22/apologiasancta-ui/releases/latest/download/apologia-sancta.apk

      - name: Build signed APK and AAB
        run: npm run apk:release
        env:
          CAPACITOR_BUILD_MODE: production
          CAPACITOR_SERVER_URL: https://sandybrown-bear-488955.hostingersite.com
          NEXT_PUBLIC_APP_URL: https://sandybrown-bear-488955.hostingersite.com
          APP_VERSION_NAME: ${{ inputs.release_tag != '' && inputs.release_tag || format('main-{0}', github.run_number) }}
          APKSIGN_KEYSTORE: android/app/apologiasancta-release.jks
          APKSIGN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APKSIGN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APKSIGN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: apologiasancta-android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            public/downloads/apologia-sancta.apk
            public/downloads/apologia-sancta-v*.apk

      - name: Publish GitHub Release assets
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          FILES=(public/downloads/apologia-sancta.apk public/downloads/apologia-sancta-v*.apk android/app/build/outputs/bundle/release/*.aab)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${FILES[@]}" --title "Apologia Sancta Android $RELEASE_TAG"
          fi
