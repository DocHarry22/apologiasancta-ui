name: Android CI

# GitHub distribution release automation is intentionally triggered by the
# [android-release] commit marker or workflow_dispatch. Play Store signing
# remains separate and must use the eventual Play upload key.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CAPACITOR_BUILD_MODE: production
  CAPACITOR_SERVER_URL: ${{ vars.ANDROID_APP_URL || 'https://sandybrown-bear-488955.hostingersite.com' }}
  NEXT_PUBLIC_APP_URL: ${{ vars.ANDROID_APP_URL || 'https://sandybrown-bear-488955.hostingersite.com' }}
  NEXT_PUBLIC_ENGINE_URL: ${{ vars.ANDROID_ENGINE_URL || 'https://apologiasancta-engine.onrender.com' }}
  NEXT_PUBLIC_RESEARCH_GRAPH_URL: ${{ vars.ANDROID_GRAPH_URL || 'https://mediumvioletred-kingfisher-797460.hostingersite.com' }}
  NEXT_PUBLIC_ANDROID_APK_URL: https://github.com/DocHarry22/apologiasancta-ui/releases/latest/download/apologia-sancta.apk

jobs:
  debug-apk:
    name: Debug APK / SDK 36
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Configure Gradle cache and wrapper validation
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Sync Capacitor Android project
        run: npm run cap:sync
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Run Android unit tests, lint, and debug build
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
      - name: Verify debug APK
        id: verify-apk
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find android/app/build/outputs/apk/debug -type f -name '*-debug.apk' -print -quit)"
          test -n "$apk_path"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$sdk_root/build-tools/35.0.0/apksigner" verify --verbose "$apk_path"
          badging="$("$sdk_root/build-tools/35.0.0/aapt2" dump badging "$apk_path")"
          printf '%s\n' "$badging" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label:)"
          grep -Fq "targetSdkVersion:'36'" <<< "$badging"
          "$sdk_root/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$apk_path"
          sha256sum "$apk_path"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "### Android debug validation" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: apologiasancta-debug-${{ github.sha }}
          path: ${{ steps.verify-apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: GitHub release APK 1.0.3
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Sync Capacitor Android project
        run: npm run cap:sync
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Create ephemeral GitHub distribution signing key
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/apologia-sancta-github-distribution.jks"
          password="$(openssl rand -hex 32)"
          keytool -genkeypair -v \
            -keystore "$keystore" \
            -storepass "$password" \
            -keypass "$password" \
            -alias apologia-sancta-github \
            -keyalg RSA \
            -keysize 4096 \
            -validity 8250 \
            -dname "CN=Apologia Sancta, OU=GitHub Distribution, O=Apologia Sancta, L=South Africa, C=ZA"
          {
            echo "APKSIGN_KEYSTORE=$keystore"
            echo "APKSIGN_KEYSTORE_PASSWORD=$password"
            echo "APKSIGN_KEY_ALIAS=apologia-sancta-github"
            echo "APKSIGN_KEY_PASSWORD=$password"
            echo "APP_VERSION_CODE=3"
            echo "APP_VERSION_NAME=1.0.3"
          } >> "$GITHUB_ENV"
      - name: Build signed release APK and AAB
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest lintRelease assembleRelease bundleRelease
      - name: Validate release APK
        id: release-artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk_path="android/app/build/outputs/apk/release/app-release.apk"
          aab_path="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$apk_path"
          test -f "$aab_path"
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$sdk_root/build-tools/35.0.0/apksigner" verify --verbose "$apk_path"
          badging="$("$sdk_root/build-tools/35.0.0/aapt2" dump badging "$apk_path")"
          grep -Fq "targetSdkVersion:'36'" <<< "$badging"
          grep -Fq "versionCode='3'" <<< "$badging"
          grep -Fq "versionName='1.0.3'" <<< "$badging"
          "$sdk_root/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$apk_path"
          sha256sum "$apk_path" "$aab_path"
          echo "### GitHub release validation" >> "$GITHUB_STEP_SUMMARY"
          echo "API 36 release APK/AAB built, signed, target-SDK verified and 16 KB aligned." >> "$GITHUB_STEP_SUMMARY"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "aab_path=$aab_path" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="android-v1.0.3"
          apk="${{ steps.release-artifacts.outputs.apk_path }}"
          aab="${{ steps.release-artifacts.outputs.aab_path }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$tag" "$apk#apologia-sancta.apk" "$aab#apologia-sancta.aab" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Apologia Sancta Android 1.0.3" \
            --notes "Production Android build for GitHub distribution. Target SDK 36 / Android 16. Includes the latest Play Store readiness, account deletion, privacy and security changes. The APK is signed with an ephemeral GitHub-distribution key and is not the future Google Play upload key." \
            --latest
      - name: Upload release artifacts to Actions
        uses: actions/upload-artifact@v7
        with:
          name: apologiasancta-android-1.0.3
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
