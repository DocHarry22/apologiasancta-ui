name: Autonomous Catholic content agent
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catholic-content-agent
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Evaluate optional worker configuration
        id: preflight
        env:
          SCHEDULE_ENABLED: ${{ vars.CONTENT_AGENT_SCHEDULE_ENABLED }}
          AGENT_APP_URL: ${{ vars.CONTENT_AGENT_APP_URL }}
          AGENT_SECRET: ${{ secrets.CONTENT_AGENT_CRON_SECRET }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$SCHEDULE_ENABLED" != "true" ]; then
            echo "run_worker=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Content agent skipped"
              echo
              echo "The optional scheduled worker is disabled. Set \`CONTENT_AGENT_SCHEDULE_ENABLED=true\` to enable it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "$AGENT_APP_URL" ] || [ -z "$AGENT_SECRET" ]; then
            echo "run_worker=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Content agent skipped"
              echo
              echo "The optional worker is not fully configured. Set \`CONTENT_AGENT_APP_URL\` and \`CONTENT_AGENT_CRON_SECRET\` to enable it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          case "$AGENT_APP_URL" in
            https://*) ;;
            *)
              echo "Configured CONTENT_AGENT_APP_URL must use HTTPS." >&2
              exit 1
              ;;
          esac

          echo "run_worker=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Content agent ready"
            echo
            echo "Optional worker configuration is present; the protected endpoint will be called."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the persistent content pipeline
        if: steps.preflight.outputs.run_worker == 'true'
        env:
          AGENT_APP_URL: ${{ vars.CONTENT_AGENT_APP_URL }}
          AGENT_SECRET: ${{ secrets.CONTENT_AGENT_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 660 \
            --request POST --header "Authorization: Bearer $AGENT_SECRET" \
            "${AGENT_APP_URL%/}/api/internal/content-agent"
