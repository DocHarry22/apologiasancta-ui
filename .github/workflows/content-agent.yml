name: Autonomous Catholic content agent
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catholic-content-agent
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run the persistent content pipeline
        env:
          AGENT_APP_URL: ${{ vars.CONTENT_AGENT_APP_URL }}
          AGENT_SECRET: ${{ secrets.CONTENT_AGENT_CRON_SECRET }}
        run: |
          if [ -z "$AGENT_APP_URL" ] || [ -z "$AGENT_SECRET" ]; then
            echo "Configure CONTENT_AGENT_APP_URL and CONTENT_AGENT_CRON_SECRET before activating the worker."
            exit 1
          fi
          case "$AGENT_APP_URL" in
            https://*) ;;
            *) echo "Agent app URL must use HTTPS"; exit 1 ;;
          esac
          curl --fail-with-body --silent --show-error --max-time 660 \
            --request POST --header "Authorization: Bearer $AGENT_SECRET" \
            "${AGENT_APP_URL%/}/api/internal/content-agent"
