name: UI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply non-breaking npm audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches package.json."
          else
            git add package-lock.json
            git commit -m "chore(deps): apply npm audit fixes to lockfile"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

  verify:
    needs: refresh-lockfile
    if: always() && (needs.refresh-lockfile.result == 'success' || needs.refresh-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Production dependency audit
        run: npm run audit:production

      - name: High-severity dependency audit
        run: npm run audit:high

      - name: Complete dependency audit
        run: npm run audit:all

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Component and route tests
        run: npm run test:vitest

      - name: Build
        run: npm run build

      - name: Playwright install
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

  editorial-database-acceptance:
    needs: refresh-lockfile
    if: always() && (needs.refresh-lockfile.result == 'success' || needs.refresh-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apologia_editorial_acceptance
          POSTGRES_USER: apologia
          POSTGRES_PASSWORD: acceptance-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apologia -d apologia_editorial_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: apologia_editorial_acceptance
          MYSQL_USER: apologia
          MYSQL_PASSWORD: acceptance-mysql-password
          MYSQL_ROOT_PASSWORD: acceptance-mysql-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent -h 127.0.0.1 -uroot -pacceptance-mysql-root-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: PostgreSQL editorial acceptance
        run: npm run test:editorial-database
        env:
          EDITORIAL_ACCEPTANCE_DATABASE_URL: postgresql://apologia:acceptance-postgres-password@127.0.0.1:5432/apologia_editorial_acceptance

      - name: MySQL editorial acceptance
        run: npm run test:editorial-database
        env:
          EDITORIAL_ACCEPTANCE_DATABASE_URL: mysql://apologia:acceptance-mysql-password@127.0.0.1:3306/apologia_editorial_acceptance

  database-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Apply migrations to disposable database
        run: supabase db start

      - name: Run Phase 2 governance SQL regression
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --set=ON_ERROR_STOP=1 --file=supabase/tests/phase2_governance_test.sql

      - name: Run saved journey policy regression
        run: psql postgresql://postgres:postgres@127.0.0.1:54322/postgres --set=ON_ERROR_STOP=1 --file=supabase/tests/knowledge_journeys_test.sql
