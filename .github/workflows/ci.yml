name: UI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run types

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Playwright install
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
