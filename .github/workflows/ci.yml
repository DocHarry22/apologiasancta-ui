name: UI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Component and route tests
        run: npm run test:vitest

      - name: Build
        run: npm run build

      - name: Playwright install
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

  editorial-database-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apologia_editorial_acceptance
          POSTGRES_USER: apologia
          POSTGRES_PASSWORD: acceptance-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apologia -d apologia_editorial_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: apologia_editorial_acceptance
          MYSQL_USER: apologia
          MYSQL_PASSWORD: acceptance-mysql-password
          MYSQL_ROOT_PASSWORD: acceptance-mysql-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent -h 127.0.0.1 -uroot -pacceptance-mysql-root-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: PostgreSQL editorial acceptance
        run: npm run test:editorial-database
        env:
          EDITORIAL_ACCEPTANCE_DATABASE_URL: postgresql://apologia:acceptance-postgres-password@127.0.0.1:5432/apologia_editorial_acceptance

      - name: MySQL editorial acceptance
        run: npm run test:editorial-database
        env:
          EDITORIAL_ACCEPTANCE_DATABASE_URL: mysql://apologia:acceptance-mysql-password@127.0.0.1:3306/apologia_editorial_acceptance
