name: Android signed release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag, for example android-v1.0.1
        required: true
        type: string
      version_code:
        description: Explicit, increasing Android versionCode (1 to 2100000000)
        required: true
        type: string
      version_name:
        description: Android versionName, for example 1.0.1
        required: true
        type: string
      app_url:
        description: Production HTTPS app URL baked into the APK and AAB
        required: false
        type: string
      publish_release:
        description: Publish the signed artifacts to the requested GitHub release tag
        required: false
        default: false
        type: boolean
  push:
    tags:
      - android-v*

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  signing-preflight:
    name: Signing credential preflight
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ready: ${{ steps.check.outputs.ready }}

    steps:
      - name: Check signing credential availability
        id: check
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)

          if (( ${#missing[@]} == 0 )); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All Android signing credentials are configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Signed Android release skipped"
              echo "Configure these GitHub Actions secrets before retrying:"
              printf -- '- `%s`\n' "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Android release requires persistent signing credentials; no artifact was built." >&2
            exit 1
          fi

  signed-release:
    name: Signed APK and Play AAB
    needs: signing-preflight
    if: needs.signing-preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CAPACITOR_BUILD_MODE: production
      CAPACITOR_SERVER_URL: ${{ inputs.app_url || vars.ANDROID_APP_URL || 'https://sandybrown-bear-488955.hostingersite.com' }}
      NEXT_PUBLIC_APP_URL: ${{ inputs.app_url || vars.ANDROID_APP_URL || 'https://sandybrown-bear-488955.hostingersite.com' }}
      NEXT_PUBLIC_ENGINE_URL: ${{ vars.ANDROID_ENGINE_URL || 'https://apologiasancta-engine.onrender.com' }}
      NEXT_PUBLIC_RESEARCH_GRAPH_URL: ${{ vars.ANDROID_GRAPH_URL || 'https://mediumvioletred-kingfisher-797460.hostingersite.com' }}
      NEXT_PUBLIC_ANDROID_APK_URL: https://github.com/DocHarry22/apologiasancta-ui/releases/latest/download/apologia-sancta.apk
      APP_VERSION_CODE: ${{ inputs.version_code || vars.ANDROID_VERSION_CODE }}
      APP_VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
      RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0
          log-accepted-android-sdk-licenses: false

      - name: Configure Gradle cache and wrapper validation
        uses: gradle/actions/setup-gradle@v6

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          export APP_VERSION_NAME="${APP_VERSION_NAME#android-v}"
          node scripts/validate-android-release.cjs
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"
          [[ "$ANDROID_SIGNING_CERT_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]] || {
            echo "Set ANDROID_SIGNING_CERT_SHA256 to the trusted signing certificate SHA-256 (64 hex characters)." >&2
            exit 1
          }
          [[ "$RELEASE_TAG" == "android-v$APP_VERSION_NAME" ]] || {
            echo "Release tag must equal android-v followed by version_name." >&2
            exit 1
          }

      - name: Preserve existing release assets
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # A failed API call must not be mistaken for proof that a release is absent.
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')"
          if grep -Fxq "$RELEASE_TAG" <<< "$releases"; then
            echo "Release already exists; use a new version rather than replacing signed assets." >&2
            exit 1
          fi

      - name: Download previous public APK for upgrade continuity checks
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false and .prerelease == false) | select(any(.assets[]; .name == "apologia-sancta.apk")) | .tag_name' | sed -n '1p')"
          if [[ -n "$previous_tag" ]]; then
            mkdir -p "$RUNNER_TEMP/previous-android"
            gh release download "$previous_tag" --pattern apologia-sancta.apk --dir "$RUNNER_TEMP/previous-android"
          fi

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          APKSIGN_KEYSTORE: ${{ runner.temp }}/apologiasancta-release.jks
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$APKSIGN_KEYSTORE"
          test -s "$APKSIGN_KEYSTORE"

      - name: Sync Capacitor Android project
        run: npm run cap:sync

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Lint and build signed APK and AAB
        working-directory: android
        env:
          APKSIGN_KEYSTORE: ${{ runner.temp }}/apologiasancta-release.jks
          APKSIGN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          APKSIGN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APKSIGN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace lintRelease assembleRelease bundleRelease

      - name: Verify and package signed artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail
          apk_path="android/app/build/outputs/apk/release/app-release.apk"
          aab_path="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk_path"
          test -s "$aab_path"

          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          badging="$("$sdk_root/build-tools/35.0.0/aapt2" dump badging "$apk_path")"
          printf '%s\n' "$badging" \
            | grep -E "^(package:|sdkVersion:|targetSdkVersion:|application-label:)"
          grep -Fq "targetSdkVersion:'36'" <<< "$badging" || {
            echo "Release artifact does not target API 36." >&2
            exit 1
          }
          "$sdk_root/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$apk_path"

          apk_verification="$(
            "$sdk_root/build-tools/35.0.0/apksigner" \
              verify --verbose --print-certs "$apk_path"
          )"
          printf '%s\n' "$apk_verification"
          if grep -Fqi "CN=Android Debug" <<< "$apk_verification"; then
            echo "Refusing to publish an APK signed with the Android debug certificate." >&2
            exit 1
          fi
          actual_fingerprint="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$apk_verification")"
          [[ "${actual_fingerprint,,}" == "${ANDROID_SIGNING_CERT_SHA256,,}" ]] || {
            echo "APK certificate does not match the pinned persistent signing identity." >&2
            exit 1
          }
          grep -Fq "name='com.apologiasancta.live'" <<< "$badging"
          grep -Fq "versionCode='$APP_VERSION_CODE'" <<< "$badging"
          grep -Fq "versionName='$APP_VERSION_NAME'" <<< "$badging"
          previous_apk="$RUNNER_TEMP/previous-android/apologia-sancta.apk"
          if [[ -f "$previous_apk" ]]; then
            previous_verification="$("$sdk_root/build-tools/35.0.0/apksigner" verify --print-certs "$previous_apk")"
            previous_fingerprint="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$previous_verification")"
            [[ "${previous_fingerprint,,}" == "${actual_fingerprint,,}" ]] || {
              echo "Signing certificate changed; existing users cannot upgrade in place. Recover the original key before publishing." >&2
              exit 1
            }
            previous_badging="$("$sdk_root/build-tools/35.0.0/aapt2" dump badging "$previous_apk")"
            export PREVIOUS_VERSION_CODE="$(sed -n "s/^package: .*versionCode='\\([^']*\\)'.*/\\1/p" <<< "$previous_badging")"
            node scripts/validate-android-release.cjs
          fi
          # Android upload keys are normally self-signed. `-strict` turns that
          # expected certificate-chain warning into exit code 4, so verify the
          # archive without strict trust checks and require jarsigner's positive
          # verification result. An unsigned archive otherwise exits with zero.
          if ! aab_verification="$(
            jarsigner \
              -J-Duser.language=en \
              -J-Duser.country=US \
              -verify "$aab_path" 2>&1
          )"; then
            echo "AAB signature verification failed." >&2
            exit 1
          fi
          if ! grep -Fqx "jar verified." <<< "$aab_verification"; then
            echo "AAB signature verification did not report a verified archive." >&2
            exit 1
          fi

          safe_version="${APP_VERSION_NAME//[^0-9A-Za-z._-]/-}"
          artifact_dir="$RUNNER_TEMP/android-release"
          mkdir -p "$artifact_dir"
          install -m 0644 "$apk_path" "$artifact_dir/apologia-sancta.apk"
          install -m 0644 "$apk_path" "$artifact_dir/apologia-sancta-$safe_version.apk"
          install -m 0644 "$aab_path" "$artifact_dir/apologia-sancta.aab"
          install -m 0644 "$aab_path" "$artifact_dir/apologia-sancta-$safe_version.aab"
          (
            cd "$artifact_dir"
            sha256sum ./*.apk ./*.aab > SHA256SUMS
          )

          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          echo "safe_version=$safe_version" >> "$GITHUB_OUTPUT"
          {
            echo "### Signed Android 16 artifacts"
            echo "The API 36 target, 16 KB ZIP alignment, APK/AAB signatures, and release lint were verified. SHA-256 checksums are included with the workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: apologia-sancta-android-${{ steps.package.outputs.safe_version }}
          path: ${{ steps.package.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release assets
        if: github.event_name == 'push' || inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: ${{ steps.package.outputs.artifact_dir }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find "$ARTIFACT_DIR" -maxdepth 1 -type f -print)
          gh release create "$RELEASE_TAG" "${files[@]}" \
            --title "Apologia Sancta Android $APP_VERSION_NAME" \
            --target "$GITHUB_SHA"

      - name: Remove decoded keystore
        if: always()
        shell: bash
        env:
          APKSIGN_KEYSTORE: ${{ runner.temp }}/apologiasancta-release.jks
        run: rm -f "$APKSIGN_KEYSTORE"
