name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example android-v1.0.1"
        required: true
        type: string
      version_name:
        description: "Android versionName, for example 1.0.1"
        required: true
        type: string
      app_url:
        description: "Production HTTPS app URL baked into the APK"
        required: true
        type: string
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    env:
      CAPACITOR_BUILD_MODE: production
      CAPACITOR_SERVER_URL: ${{ github.event.inputs.app_url || vars.CAPACITOR_SERVER_URL }}
      NEXT_PUBLIC_APP_URL: ${{ github.event.inputs.app_url || vars.CAPACITOR_SERVER_URL }}
      NEXT_PUBLIC_ENGINE_URL: ${{ vars.NEXT_PUBLIC_ENGINE_URL || 'https://apologiasancta-engine.onrender.com' }}
      NEXT_PUBLIC_ANDROID_APK_URL: https://github.com/DocHarry22/apologiasancta-ui/releases/latest/download/apologia-sancta.apk
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name }}
      APKSIGN_KEYSTORE: ${{ github.workspace }}/android/app/release-keystore.jks
      APKSIGN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      APKSIGN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      APKSIGN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Decode signing keystore
        run: |
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$APKSIGN_KEYSTORE"

      - name: Build signed release APK
        run: npm run apk:release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apologia-sancta-release-apk
          path: |
            public/downloads/apologia-sancta.apk
            public/downloads/apologia-sancta-v*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Apologia Sancta Android ${{ github.event.inputs.version_name || github.ref_name }}
          files: |
            public/downloads/apologia-sancta.apk
            public/downloads/apologia-sancta-v*.apk
