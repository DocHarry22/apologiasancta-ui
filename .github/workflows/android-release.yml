name: Android Release APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example android-v1.0.1"
        required: true
        type: string
      version_code:
        description: "Android versionCode, must be greater than previous release"
        required: false
        default: "2"
        type: string
      version_name:
        description: "Android versionName, for example 1.0.1"
        required: true
        type: string
      app_url:
        description: "Production HTTPS app URL baked into the APK"
        required: true
        type: string
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    env:
      CAPACITOR_BUILD_MODE: production
      CAPACITOR_SERVER_URL: ${{ github.event.inputs.app_url || 'https://sandybrown-bear-488955.hostingersite.com' }}
      NEXT_PUBLIC_APP_URL: ${{ github.event.inputs.app_url || 'https://sandybrown-bear-488955.hostingersite.com' }}
      NEXT_PUBLIC_ENGINE_URL: https://apologiasancta-engine.onrender.com
      NEXT_PUBLIC_RESEARCH_GRAPH_URL: https://mediumvioletred-kingfisher-797460.hostingersite.com
      NEXT_PUBLIC_ANDROID_APK_URL: https://github.com/DocHarry22/apologiasancta-ui/releases/latest/download/apologia-sancta.apk
      APP_VERSION_CODE: ${{ github.event.inputs.version_code || '2' }}
      APP_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
      APKSIGN_KEYSTORE: ${{ github.workspace }}/android/app/release-keystore.jks
      APKSIGN_KEYSTORE_PASSWORD: ${{ secrets['ANDROID_KEYSTORE_PASSWORD'] }}
      APKSIGN_KEY_ALIAS: ${{ secrets['ANDROID_KEY_ALIAS'] }}
      APKSIGN_KEY_PASSWORD: ${{ secrets['ANDROID_KEY_PASSWORD'] || secrets['ANDROID_KEYSTORE_PASSWORD'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install

      - name: Decode signing keystore
        run: |
          test -n "${{ secrets['ANDROID_KEYSTORE_BASE64'] }}"
          printf '%s' "${{ secrets['ANDROID_KEYSTORE_BASE64'] }}" | base64 --decode > "$APKSIGN_KEYSTORE"

      - name: Build signed release APK
        run: npm run apk:release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: apologia-sancta-release-apk
          path: |
            public/downloads/apologia-sancta.apk
            public/downloads/apologia-sancta-v*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
          RELEASE_NAME: Apologia Sancta Android ${{ github.event.inputs.version_name || '1.0.0' }}
        run: |
          set -euo pipefail
          FILES=(public/downloads/apologia-sancta.apk public/downloads/apologia-sancta-v*.apk)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${FILES[@]}" --title "$RELEASE_NAME"
          fi

